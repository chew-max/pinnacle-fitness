# =========================================================
# STORE SEO
# Update these values when cloning the storefront.
# =========================================================

title: "Pinnacle Fitness Brand"
description: "Fitness, apparel, and everyday essentials with personality."

url: "https://chew-max.github.io"
baseurl: "/pinnacle-fitness"

logo: "/assets/images/logo.svg"

markdown: kramdown
permalink: pretty

collections:
  products:
    output: true
    permalink: /products/:name/

defaults:
  - scope:
      path: ""
      type: products
    values:
      layout: product
      seo:
        type: Product

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor